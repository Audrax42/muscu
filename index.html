<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Muscu">
  <title>Muscu</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <nav id="tabbar" aria-label="Navigation">
    <button data-act="go" data-view="home"><i>🏠</i>Accueil</button>
    <button data-act="go" data-view="upcoming"><i>📅</i>À venir</button>

  <div id="sheet" hidden></div>
  <div id="toast" role="status"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <noscript><p style="padding:20px">JavaScript est nécessaire pour utiliser cette application.</p></noscript>
  <script src="data.js"></script>
  <script src="app.js"></script>
